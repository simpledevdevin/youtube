[project]
name = "youtube-content-planning"
version = "0.1.0"
description = "A hosted MCP server for a personal book catalog (Turso + Prefect Horizon)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.0",
    "libsql>=0.1.11",
    "psutil>=7.2.2",
]

[project.scripts]
youtube-content-planning = "youtube_content_planning:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# cryptography>=49 dropped Intel macOS wheels; keep a prebuilt version
constraint-dependencies = ["cryptography<49"]
