generate_topic_task:
  description: >
    Use web search to bring up ONE current sports topic.

    Requirements:
    - You MUST use your search tool to find a real sports news story/event.
    - The story/event MUST be within the last 30 days relative to {current_date}.
    - Prefer major leagues/events (NFL/NBA/MLB/NHL/soccer/tennis/golf/F1/Olympics, etc.).
    - If a result is older than 30 days, discard it and search again with a different query.
  expected_output: >
    One real sports headline/topic from the last 30 days (relative to {current_date}). Only return the headline/topic, no other text.
  agent: moderator

generate_hot_take_task:
  description: >
    Generate a hot take based on the topic provided in context.
  context:
    - generate_topic_task
  expected_output: >
    The hot take should be appropriate for general audiences. Only return the hot take, no other text. The hot take should be appropriate for general audiences.
  agent: junior_debator

improve_hot_take_task:
  description: >
    Improve upon the hot take provided in context by providing a more detailed and convincing argument. Provide facts and examples to support your points.
  context:
    - generate_hot_take_task
  expected_output: >
    Only return the improved hot take, no other text. The hot take should be appropriate for general audiences.
  agent: senior_debator

counter_hot_take_task:
  description: >
    Argue against the improved hot take provided in context by providing a counter argument. Provide facts and examples to support your points.
  context:
    - improve_hot_take_task
  expected_output: >
    Only return the counter argument, no other text. The counter argument should be appropriate for general audiences.
  agent: counter_debator
